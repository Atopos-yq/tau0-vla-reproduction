experiment:
  run_name: agibot_gong_head_smoke
  project_name: tau-0-vla
  notes: Worked post-training example on the bundled AgiBot World subset.
model_args:
  model_name_or_path: checkpoints/tau-0-vla-base
  vlm_model_type: qwen3.5
  vla_model_type: tau0_vla
  tune_mm_vision: false
  tune_mm_mlp: false
  tune_mm_llm: false
  tune_vla_dit: true
  loss_type: fm
  num_steps: 10
  vlm_causal: true
  tau_vla_prefix_flash_backend: true
  vla_inactive_input_zero: true
data_args:
  config_name: agibot_world_gong_ft
  max_images_per_sample: 3
  vla_max_token_len: 2048
  max_pixels: 50176
  min_pixels: 3136
  camera_keys:
  - head
  - wrist_left
  - wrist_right
  cam_view_template: '{} view: <image>'
  cam_view_names:
    head: head
    wrist_left: left wrist
    wrist_right: right wrist
training_args:
  output_dir: outputs/
  max_steps: 10
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  model_max_length: 2048
  learning_rate: 2.0e-05
  weight_decay: 0.01
  warmup_ratio: 0.01
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  bf16: true
  attn_implementation: sdpa
  seed: 42
  data_seed: 42
  logging_steps: 1
  vlm_first_batch_pad_to_max: true
  save_strategy: steps
  save_steps: 10
  save_total_limit: 1
  dataloader_num_workers: 0
  dataloader_drop_last: true
  dataloader_pin_memory: true
  dataloader_persistent_workers: false
  report_to: none
  ddp_find_unused_parameters: true
  ddp_timeout: 7200
  gradient_checkpointing: false
